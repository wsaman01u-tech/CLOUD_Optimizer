apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-worker-deployment
  labels:
    app.kubernetes.io/managed-by: autonomous-cloud-optimizer
spec:
  replicas: 6
  selector:
    matchLabels:
      app: cloud-worker
  template:
    metadata:
      labels:
        app: cloud-worker
    spec:
      containers:
      - name: worker
        image: cloud-worker:v1.0
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
