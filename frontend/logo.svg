<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="logoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#f5f2eb" stroke="#e6dfd1" stroke-width="1.5" />
    <!-- Cloud Base -->
    <path d="M42 35H16a9 9 0 0 1-1.2-17.9 12.5 12.5 0 0 1 24.8-3.4A9 9 0 0 1 42 35z" fill="url(#logoCloudGrad)" />
    <!-- Eco Leaf -->
    <path d="M29 19c-4.5 0-8 3.5-8 8 0 5 6 9 8 10.5 2-1.5 8-5.5 8-10.5 0-4.5-3.5-8-8-8z" fill="#ecfdf5" opacity="0.95" />
    <path d="M29 21c-3.2 0-6 2.7-6 6 0 3.8 4.2 6.8 6 8 1.8-1.2 6-4.2 6-8 0-3.3-2.8-6-6-6z" fill="url(#logoLeafGrad)" />
    <!-- Spark -->
    <path d="M30 24l-3 4h2.5l-1.2 4.5 3.8-5h-2.6l0.5-3.5z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.4" />
  </g>

  <!-- Typography -->
  <text x="72" y="31" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#1c2826" letter-spacing="-0.5">
    Cloud<tspan fill="#059669">Optimizer</tspan>
  </text>
  <text x="73" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#718096" letter-spacing="1.5">
    AUTONOMOUS AI SCALING
  </text>
